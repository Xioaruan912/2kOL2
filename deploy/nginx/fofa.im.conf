# COURTSIDE DB - fofa.im
# 80: ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fofa.im;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443: reverse proxy to the 2KOL2 backend (uvicorn on 127.0.0.1:2369)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fofa.im;

    ssl_certificate /etc/letsencrypt/live/fofa.im/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fofa.im/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 带 hash 的构建产物：长缓存
    location /assets/ {
        proxy_pass http://127.0.0.1:2369;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # API：不额外加缓存头，保留后端自己的 Cache-Control
    location /api/ {
        proxy_pass http://127.0.0.1:2369;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 70s;
        proxy_send_timeout 70s;
        proxy_connect_timeout 10s;
    }

    # 页面入口：不缓存，保证发布后立即生效
    location / {
        proxy_pass http://127.0.0.1:2369;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 70s;
        add_header Cache-Control "no-cache" always;
    }
}
